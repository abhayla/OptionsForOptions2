# API/web tests (ADR-046). Project-owned; the kit's ci.yml is not edited.
# Adapted from abhayla/algochanakya@bf9faf7:.github/workflows/backend-tests.yml (ADR-047): postgres:16 service with
# a pg_isready health check, Alembic migrations, pytest. Dropped: Redis service, Codecov, Allure.
# The trusted-clock proof (W-051) runs as the NON-superuser role ofo_app (ADR-048); migrations run as the owner.
# Passwords below are throwaway values for a CI-only container, not secrets.
name: App tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/ofo_app/**'
      - 'tests_app/**'
      - 'requirements-app.txt'
      - 'pytest-app.ini'
      - 'scripts/alembic_migration_guard.py'
      - 'scripts/generate_openapi.py'
      - 'frontend/**'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'backend/ofo_app/**'
      - 'tests_app/**'
      - 'requirements-app.txt'
      - 'pytest-app.ini'
      - 'scripts/alembic_migration_guard.py'
      - 'scripts/generate_openapi.py'
      - 'frontend/**'
      - '.github/workflows/app-tests.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres_ci_dummy_pw
      PGDATABASE: ofo_test
      APP_ROLE_PW: ofo_app_test_pw

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_dummy_pw
          POSTGRES_DB: ofo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-app.txt

      # Standard library only, so it may run before the install step.
      - name: Guard against empty Alembic migrations
        run: python scripts/alembic_migration_guard.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: Create the application role (ADR-048 attributes)
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ofo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 5 PASSWORD '${APP_ROLE_PW}'" \
            -c "ALTER ROLE ofo_app SET statement_timeout = '30s'" \
            -c "REVOKE CONNECT ON DATABASE ofo_test FROM PUBLIC" \
            -c "GRANT CONNECT ON DATABASE ofo_test TO ofo_app" \
            -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC"

      - name: Run database migrations as the owner role
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: alembic -c backend/ofo_app/alembic.ini upgrade head

      - name: OpenAPI document builds
        run: python scripts/generate_openapi.py --out "${RUNNER_TEMP}/openapi.json"

      - name: Run app tests (database tests as ofo_app)
        env:
          OFO_REQUIRE_DB_TESTS: '1'
          TEST_DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: python -m pytest -c pytest-app.ini -q -rs -p no:cacheprovider
