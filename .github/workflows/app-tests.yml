# API/web tests (ADR-046). Project-owned; the kit's ci.yml is not edited.
# Adapted from abhayla/algochanakya@bf9faf7:.github/workflows/backend-tests.yml (ADR-047): postgres:16 service with
# a pg_isready health check, Alembic migrations, pytest. Dropped: Redis service, Codecov, Allure.
# The trusted-clock proof (W-051) runs as the NON-superuser role ofo_app (ADR-048); migrations run as the owner.
# Passwords below are throwaway values for a CI-only container, not secrets.
name: App tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/ofo/**'
      - 'tests/fixtures/**'
      - 'backend/ofo_app/**'
      - 'tests_app/**'
      - 'requirements-app.txt'
      - 'pytest-app.ini'
      - 'scripts/alembic_migration_guard.py'
      - 'scripts/generate_openapi.py'
      - 'frontend/**'
      # read by the frontend proxy and the OpenAPI drift test / the recorded Kite basket the checked-basket test reads
      - 'docs/api/**'
      - 'docs/research/kite-proof-2026-10-07/**'
      - '.github/workflows/app-tests.yml'
      # the ruff ratchet (REQ-075 AC-3) covers tests/ and scripts/, so its inputs start this workflow too
      - 'tests/**'
      - 'ruff.toml'
      - 'requirements-dev.txt'
      - 'scripts/ruff_ratchet.py'
      - 'scripts/ruff_baseline.json'
      - 'scripts/**'  # tests_app/test_live_probe.py loads scripts/live/probe.py; the ratchet covers scripts/
  pull_request:
    paths:
      - 'backend/ofo/**'
      - 'tests/fixtures/**'
      - 'backend/ofo_app/**'
      - 'tests_app/**'
      - 'requirements-app.txt'
      - 'pytest-app.ini'
      - 'scripts/alembic_migration_guard.py'
      - 'scripts/generate_openapi.py'
      - 'frontend/**'
      # read by the frontend proxy and the OpenAPI drift test / the recorded Kite basket the checked-basket test reads
      - 'docs/api/**'
      - 'docs/research/kite-proof-2026-10-07/**'
      - '.github/workflows/app-tests.yml'
      # the ruff ratchet (REQ-075 AC-3) covers tests/ and scripts/, so its inputs start this workflow too
      - 'tests/**'
      - 'ruff.toml'
      - 'requirements-dev.txt'
      - 'scripts/ruff_ratchet.py'
      - 'scripts/ruff_baseline.json'
      - 'scripts/**'  # tests_app/test_live_probe.py loads scripts/live/probe.py; the ratchet covers scripts/

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # GC-6 CI-SPLIT (F-53): the workflow-level paths above only decide whether the workflow starts. Which JOBS a pull
  # request needs is decided here, per job. A push to main skips this job, which makes every job below run. If this
  # job fails or is cancelled, every job runs (fail toward testing). Filters are positive globs only (no '!').
  # tests/test_app_tests_job_selection.py evaluates these globs offline.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # the action lists the PR's files through the API
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Select the jobs this change needs
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            api:
              - 'backend/ofo/**'
              - 'backend/ofo_app/**'
              - 'tests_app/**'
              - 'tests/**'
              - 'requirements-app.txt'
              - 'requirements-dev.txt'
              - 'pytest-app.ini'
              - 'ruff.toml'
              - 'scripts/alembic_migration_guard.py'
              - 'scripts/generate_openapi.py'
              - 'scripts/ruff_ratchet.py'
              - 'scripts/ruff_baseline.json'
              - 'scripts/**'
              - 'docs/api/**'
              - 'docs/research/kite-proof-2026-10-07/**'
              - '.github/workflows/app-tests.yml'
            # frontend job: lint, unit tests, build, Playwright journeys. Frontend-only starts no API job; backend/ofo
            # and backend/ofo_app feed it because its Playwright journeys run against the real API.
            frontend:
              - 'frontend/**'
              - 'backend/ofo/**'
              - 'backend/ofo_app/**'
              - 'tests/fixtures/**'
              - 'requirements-app.txt'
              - 'docs/api/**'
              # REQ-048 AC-5: the bundle scan runs in this job on the built output, so its files start this job
              - 'tests/test_bundle_secret_scan.py'
              - 'tests/test_app_workflow_bundle_scan.py'
              - 'tests/orchestrator/test_db_run_fresh.py'
              - 'scripts/orchestrator/db_run_fresh.py'  # the code those tests guard, and the module it imports
              - 'scripts/orchestrator/db_run.py'
              - '.github/workflows/app-tests.yml'
            # execute-screen-e2e: the Execute screen against the real ofo_app replay API, so API code also feeds it.
            e2e:
              - 'frontend/**'
              - 'backend/ofo/**'
              - 'backend/ofo_app/**'
              - 'tests/fixtures/**'
              - 'requirements-app.txt'
              - 'docs/api/**'
              - '.github/workflows/app-tests.yml'

  api:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # was 15; the W-067 full-day finalize test is bounded at 10 min by its own assertion
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres_ci_dummy_pw
      PGDATABASE: ofo_test
      APP_ROLE_PW: ofo_app_test_pw

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_dummy_pw
          POSTGRES_DB: ofo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # REQ-113: the bus between the market-data process and the API (Redis Streams). The bus tests FAIL, never skip,
      # when OFO_REQUIRE_DB_TESTS=1 and this service is missing.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-app.txt

      # W-058: the broker routes refuse to start without these. Placeholders and a key generated per run, never a
      # real secret; nothing in CI talks to Kite.
      - name: Throwaway broker settings
        run: |
          echo "KITE_API_KEY=ci_placeholder_key" >> "$GITHUB_ENV"
          echo "KITE_API_SECRET=ci_placeholder_secret" >> "$GITHUB_ENV"
          echo "KITE_REDIRECT_URL=http://127.0.0.1:8000/kite/callback" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=http://127.0.0.1:4173" >> "$GITHUB_ENV"
          echo "KITE_EXPECTED_USER_ID=ZZ0000" >> "$GITHUB_ENV"
          echo "BROKER_TOKEN_KEY=$(python -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      # Standard library only, so it may run before the install step.
      - name: Guard against empty Alembic migrations
        run: python scripts/alembic_migration_guard.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install -r requirements-dev.txt

      # Imports ruff, so it runs after the install step. Fails when any rule's count rises above the baseline.
      - name: Ruff ratchet (lint counts may fall, never rise)
        run: python scripts/ruff_ratchet.py

      # Timeouts, the TEMPORARY/CREATE revokes and the privilege allowlist live in migration 0001 (every host).
      - name: Create the application role (ADR-048 attributes)
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ofo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 5 PASSWORD '${APP_ROLE_PW}'" \
            -c "REVOKE CONNECT ON DATABASE ofo_test FROM PUBLIC" \
            -c "GRANT CONNECT ON DATABASE ofo_test TO ofo_app"

      - name: Run database migrations as the owner role
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: alembic -c backend/ofo_app/alembic.ini upgrade head

      - name: OpenAPI document builds
        run: python scripts/generate_openapi.py --out "${RUNNER_TEMP}/openapi.json"

      - name: Run app tests (database tests as ofo_app)
        env:
          OFO_REQUIRE_DB_TESTS: '1'
          TEST_DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
          REDIS_URL: redis://localhost:6379/0  # REQ-113: the bus tests (tests_app/test_bus_socket.py and the feed tests)
          # W-067 r2: finalize of a FULL trading day (F-33: about 1,603 instruments x 375 minutes = 601,125 bars) runs
          # here only; a developer PC runs the same test at 40 instruments (its PostgreSQL also serves production).
          OFO_HISTORY_SCALE_INSTRUMENTS: '1603'
          OFO_HISTORY_SCALE_BOUND_S: '600'
          OFO_HISTORY_SCALE_BATCH_BOUND_S: '45'
        run: python -m pytest -c pytest-app.ini -q -rs -p no:cacheprovider

      # W-101 core proof (REQ-073 AC-3, AC-4): a TEST-ONLY API (APP_ENV=test + EXECUTE_REPLAY=1, port 8011) answers
      # Execute and the return from the recorded 2026-10-16 Kite replies (no live session, no live feed). Runs AFTER the
      # app suite: the seed commits strategy id 1, which the route tests need free. The seed runs as the owner role (it
      # sets id 1, as the route tests do), the API as ofo_app. The server is stopped by PID when the step ends.
      - name: Execute replay API - ENTRY then return over HTTP (port 8011)
        env:
          APP_ENV: test
          EXECUTE_REPLAY: '1'
          OFO_ORDER_PATH: '1'  # W-121: the order path is off unless APP_ENV=test + this
          TEST_CATALOGUE_DATE: '2026-10-16'
          PYTHONPATH: backend
          EXECUTE_REPLAY_URL: http://127.0.0.1:8011
        run: |
          DATABASE_URL="postgresql+asyncpg://postgres:${PGPASSWORD}@localhost:5432/ofo_test" python -m ofo_app.seed_execute_replay
          DATABASE_URL="postgresql+asyncpg://ofo_app:${APP_ROLE_PW}@localhost:5432/ofo_test" nohup python -m uvicorn --factory ofo_app.main:create_app --app-dir backend --loop ofo_app.event_loop:selector_loop --host 127.0.0.1 --port 8011 > "${RUNNER_TEMP}/uvicorn-execute-replay.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -n 40 "${RUNNER_TEMP}/uvicorn-execute-replay.log"' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8011/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8011/health
          python -m pytest -c pytest-app.ini -q -rs -p no:cacheprovider tests_app/test_execute_replay_api.py

  # W-054: frontend skeleton. Core proof: browser -> Vite preview /api proxy -> FastAPI (ofo_app) -> PostgreSQL.
  frontend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres_ci_dummy_pw
      PGDATABASE: ofo_test
      APP_ROLE_PW: ofo_app_test_pw

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_dummy_pw
          POSTGRES_DB: ofo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-app.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Throwaway broker settings (W-058; as in the api job)
        run: |
          echo "KITE_API_KEY=ci_placeholder_key" >> "$GITHUB_ENV"
          echo "KITE_API_SECRET=ci_placeholder_secret" >> "$GITHUB_ENV"
          echo "KITE_REDIRECT_URL=http://127.0.0.1:8000/kite/callback" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=http://127.0.0.1:4173" >> "$GITHUB_ENV"
          echo "KITE_EXPECTED_USER_ID=ZZ0000" >> "$GITHUB_ENV"
          echo "BROKER_TOKEN_KEY=$(python -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: Create the application role and run migrations (as in the api job)
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ofo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 5 PASSWORD '${APP_ROLE_PW}'" \
            -c "REVOKE CONNECT ON DATABASE ofo_test FROM PUBLIC" \
            -c "GRANT CONNECT ON DATABASE ofo_test TO ofo_app"
          alembic -c backend/ofo_app/alembic.ini upgrade head

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and unit tests
        working-directory: frontend
        run: |
          npm run lint
          npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

      # REQ-048 AC-5 (W-134): the bundle and reply scans on the REAL build output. pytest comes from the "Install
      # backend dependencies" step above (requirements-app.txt); with CI set the scan fails, never skips, when
      # frontend/dist is missing. tests/test_app_workflow_bundle_scan.py asserts this step sits after both.
      - name: Bundle and reply secret scan (REQ-048 AC-5)
        env:
          OFO_REQUIRE_BUNDLE_SCAN: '1'  # here a missing frontend/dist fails the scan; elsewhere the file skips it
        run: python -m pytest -q -p no:cacheprovider tests/test_bundle_secret_scan.py

      # finding test-skipped-in-its-only-ci-job: this file importorskips asyncpg, which only requirements-app.txt
      # installs, so the kit job always skipped it. Runs here, after "Install backend dependencies". It is pure
      # (fake runner, no database URL).
      - name: Database-drop guard tests (asyncpg)
        run: python -m pytest -q -p no:cacheprovider tests/orchestrator/test_db_run_fresh.py

      # The browser download took 11 min 18 s in run 36977878623; cache it, keyed on the lockfile (which pins the
      # @playwright/test version), and cap the step.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      # finding ci-apt-mirror-stall: three times on 2026-10-23 the runner's mirror list (mirror+file:, the Azure mirror
      # first for EVERY file) stalled `playwright install-deps` past its 12-minute cap. Short timeouts (fix 1) did not
      # help: the timeout counts only silence and failover is per file. The independent review's fix: apt reads the
      # Ubuntu archive directly, so no file waits on the Azure mirror.
      - name: apt reads the Ubuntu archive directly (no mirror list)
        run: |
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            [ -f "$f" ] && sudo sed -i -E \
              -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' \
              -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$f"
          done
          ! grep -rqsE 'mirror\+file|azure\.archive' /etc/apt/sources.list /etc/apt/sources.list.d/

      - name: Install Playwright Chromium (cache miss, browser and system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start the API (uvicorn factory) as ofo_app
        env:
          DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
          DB_POOL_SIZE: '1'  # #370: the three e2e API processes share the role's CONNECTION LIMIT 5 (ADR-048)
          DB_MAX_OVERFLOW: '0'
        run: |
          nohup python -m uvicorn --factory ofo_app.main:create_app --app-dir backend --loop ofo_app.event_loop:selector_loop --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/uvicorn.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      # W-064: TEST-ONLY replay mode (APP_ENV=test + OUTCOME_REPLAY=1) serves the recorded 2026-10-08 frames to the
      # outcome route; the screen's core proof reads it through a third preview on port 4175. The API above stays plain.
      - name: Start the API in test-only replay mode (port 8001)
        env:
          DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
          APP_ENV: test
          OUTCOME_REPLAY: '1'
          DB_POOL_SIZE: '1'
          DB_MAX_OVERFLOW: '0'
        run: |
          nohup python -m uvicorn --factory ofo_app.main:create_app --app-dir backend --loop ofo_app.event_loop:selector_loop --host 127.0.0.1 --port 8001 > "${RUNNER_TEMP}/uvicorn-replay.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/health

      # #237: the Save Draft browser e2e. CI's database is throwaway: seed it with the recorded 2026-10-08 instrument list
      # through the normal guarded loader (as ofo_app, nothing loosened, nothing deleted), then start an API whose
      # catalogue routes read 2026-10-08 as today. TEST_CATALOGUE_DATE is refused unless APP_ENV=test
      # (ofo_app.pinned_clock). Only this API (port 8002) sees the pin; the others judge expiry on the database clock.
      - name: Seed the throwaway catalogue and start the API with the test-only catalogue date (port 8002)
        env:
          DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
          APP_ENV: test
          TEST_CATALOGUE_DATE: '2026-10-08'
          PYTHONPATH: backend  # python -m ofo_app... runs from the repo root (uvicorn below uses --app-dir instead)
          DB_POOL_SIZE: '1'
          DB_MAX_OVERFLOW: '0'
        run: |
          python -m ofo_app.seed_test_catalogue
          nohup python -m uvicorn --factory ofo_app.main:create_app --app-dir backend --loop ofo_app.event_loop:selector_loop --host 127.0.0.1 --port 8002 > "${RUNNER_TEMP}/uvicorn-pinned.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8002/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8002/health

      - name: Start the built frontend (preview) with the proxy on the real API, and one on a closed port
        working-directory: frontend
        run: |
          OFO_API_TARGET=http://127.0.0.1:8002 nohup npx vite preview --port 4176 --strictPort > "${RUNNER_TEMP}/preview-pinned.log" 2>&1 &
          OFO_API_TARGET=http://127.0.0.1:8001 nohup npx vite preview --port 4175 --strictPort > "${RUNNER_TEMP}/preview-replay.log" 2>&1 &
          OFO_API_TARGET=http://127.0.0.1:8000 nohup npx vite preview --port 4173 --strictPort > "${RUNNER_TEMP}/preview.log" 2>&1 &
          OFO_API_TARGET=http://127.0.0.1:9 nohup npx vite preview --port 4174 --strictPort > "${RUNNER_TEMP}/preview-down.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && curl -sf http://127.0.0.1:4174/ > /dev/null \
              && curl -sf http://127.0.0.1:4175/ > /dev/null && curl -sf http://127.0.0.1:4176/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4176/api/health
          # the proxy reaches the real database through the real API
          curl -sf http://127.0.0.1:4173/api/health

      - name: Playwright (navigation, health, responsive check of every route; 390 and 1280 px)
        working-directory: frontend
        env:
          PREVIEW_URL: http://127.0.0.1:4173
          PREVIEW_DOWN_URL: http://127.0.0.1:4174
          REPLAY_URL: http://127.0.0.1:4175
          E2E_PINNED_CATALOGUE: '1'  # #237: un-skips strategy-save-draft.spec.ts against the seeded fixture
          SAVE_DRAFT_URL: http://127.0.0.1:4176
          E2E_MIN_EXPIRY: '2026-10-08'
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: |
            frontend/screenshots/
            frontend/test-results/
          if-no-files-found: warn

      - name: Server logs on failure
        if: failure()
        run: tail -n 50 "${RUNNER_TEMP}"/uvicorn.log "${RUNNER_TEMP}"/uvicorn-pinned.log "${RUNNER_TEMP}"/preview-pinned.log "${RUNNER_TEMP}"/preview.log "${RUNNER_TEMP}"/preview-down.log || true

  # W-104 core proof (REQ-056 AC-1, REQ-073 AC-1/AC-3): the Execute screen in a browser against W-101's TEST-ONLY
  # Execute replay API. Its own job and its own throwaway PostgreSQL, so the replay's strategy id 1 and its 2026-10-16
  # catalogue never share a database with the frontend job's seeded 2026-10-08 catalogue or its Save Draft e2e.
  # Kite is never reached: the spec intercepts and aborts every request to Kite's host. Both servers stop by PID.
  execute-screen-e2e:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres_ci_dummy_pw
      PGDATABASE: ofo_test
      APP_ROLE_PW: ofo_app_test_pw

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_dummy_pw
          POSTGRES_DB: ofo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-app.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Throwaway broker settings (as in the frontend job)
        run: |
          echo "KITE_API_KEY=ci_placeholder_key" >> "$GITHUB_ENV"
          echo "KITE_API_SECRET=ci_placeholder_secret" >> "$GITHUB_ENV"
          echo "KITE_REDIRECT_URL=http://127.0.0.1:8011/kite/callback" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=http://127.0.0.1:4177" >> "$GITHUB_ENV"
          echo "KITE_EXPECTED_USER_ID=ZZ0000" >> "$GITHUB_ENV"
          echo "BROKER_TOKEN_KEY=$(python -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: Create the application role and run migrations (as in the api job)
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ofo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 5 PASSWORD '${APP_ROLE_PW}'" \
            -c "REVOKE CONNECT ON DATABASE ofo_test FROM PUBLIC" \
            -c "GRANT CONNECT ON DATABASE ofo_test TO ofo_app"
          alembic -c backend/ofo_app/alembic.ini upgrade head

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      # finding ci-apt-mirror-stall: three times on 2026-10-23 the runner's mirror list (mirror+file:, the Azure mirror
      # first for EVERY file) stalled `playwright install-deps` past its 12-minute cap. Short timeouts (fix 1) did not
      # help: the timeout counts only silence and failover is per file. The independent review's fix: apt reads the
      # Ubuntu archive directly, so no file waits on the Azure mirror.
      - name: apt reads the Ubuntu archive directly (no mirror list)
        run: |
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            [ -f "$f" ] && sudo sed -i -E \
              -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' \
              -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$f"
          done
          ! grep -rqsE 'mirror\+file|azure\.archive' /etc/apt/sources.list /etc/apt/sources.list.d/

      - name: Install Playwright Chromium (cache miss, browser and system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Execute screen e2e on the Execute replay API (API 8011, preview 4177)
        env:
          APP_ENV: test
          EXECUTE_REPLAY: '1'
          OFO_ORDER_PATH: '1'  # W-121: the order path is off unless APP_ENV=test + this
          TEST_CATALOGUE_DATE: '2026-10-16'
          PYTHONPATH: backend
          EXECUTE_REPLAY_URL: http://127.0.0.1:4177
        run: |
          DATABASE_URL="postgresql+asyncpg://postgres:${PGPASSWORD}@localhost:5432/ofo_test" python -m ofo_app.seed_execute_replay
          DATABASE_URL="postgresql+asyncpg://ofo_app:${APP_ROLE_PW}@localhost:5432/ofo_test" nohup python -m uvicorn --factory ofo_app.main:create_app --app-dir backend --loop ofo_app.event_loop:selector_loop --host 127.0.0.1 --port 8011 > "${RUNNER_TEMP}/uvicorn-execute-screen.log" 2>&1 &
          API_PID=$!
          (cd frontend && OFO_API_TARGET=http://127.0.0.1:8011 nohup npx vite preview --port 4177 --strictPort > "${RUNNER_TEMP}/preview-execute-screen.log" 2>&1) &
          PREVIEW_PID=$!
          trap 'kill "$API_PID" "$PREVIEW_PID" 2>/dev/null || true; pkill -P "$PREVIEW_PID" 2>/dev/null || true; tail -n 40 "${RUNNER_TEMP}/uvicorn-execute-screen.log" "${RUNNER_TEMP}/preview-execute-screen.log"' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4177/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4177/api/health
          cd frontend && npx playwright test e2e/execute-screen.spec.ts --project=desktop-1280
