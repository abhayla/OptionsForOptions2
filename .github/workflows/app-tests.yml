# API/web tests (ADR-046). Project-owned; the kit's ci.yml is not edited.
# Adapted from abhayla/algochanakya@bf9faf7:.github/workflows/backend-tests.yml (ADR-047): postgres:16 service with
# a pg_isready health check, Alembic migrations, pytest. Dropped: Redis service, Codecov, Allure.
# The trusted-clock proof (W-051) runs as the NON-superuser role ofo_app (ADR-048); migrations run as the owner.
# Passwords below are throwaway values for a CI-only container, not secrets.
name: App tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/ofo/**'
      - 'tests/fixtures/**'
      - 'backend/ofo_app/**'
      - 'tests_app/**'
      - 'requirements-app.txt'
      - 'pytest-app.ini'
      - 'scripts/alembic_migration_guard.py'
      - 'scripts/generate_openapi.py'
      - 'frontend/**'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'backend/ofo/**'
      - 'tests/fixtures/**'
      - 'backend/ofo_app/**'
      - 'tests_app/**'
      - 'requirements-app.txt'
      - 'pytest-app.ini'
      - 'scripts/alembic_migration_guard.py'
      - 'scripts/generate_openapi.py'
      - 'frontend/**'
      - '.github/workflows/app-tests.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres_ci_dummy_pw
      PGDATABASE: ofo_test
      APP_ROLE_PW: ofo_app_test_pw

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_dummy_pw
          POSTGRES_DB: ofo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-app.txt

      # W-058: the broker routes refuse to start without these. Placeholders and a key generated per run, never a
      # real secret; nothing in CI talks to Kite.
      - name: Throwaway broker settings
        run: |
          echo "KITE_API_KEY=ci_placeholder_key" >> "$GITHUB_ENV"
          echo "KITE_API_SECRET=ci_placeholder_secret" >> "$GITHUB_ENV"
          echo "KITE_REDIRECT_URL=http://127.0.0.1:8000/kite/callback" >> "$GITHUB_ENV"
          echo "KITE_EXPECTED_USER_ID=ZZ0000" >> "$GITHUB_ENV"
          echo "BROKER_TOKEN_KEY=$(python -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      # Standard library only, so it may run before the install step.
      - name: Guard against empty Alembic migrations
        run: python scripts/alembic_migration_guard.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      # Timeouts, the TEMPORARY/CREATE revokes and the privilege allowlist live in migration 0001 (every host).
      - name: Create the application role (ADR-048 attributes)
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ofo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 5 PASSWORD '${APP_ROLE_PW}'" \
            -c "REVOKE CONNECT ON DATABASE ofo_test FROM PUBLIC" \
            -c "GRANT CONNECT ON DATABASE ofo_test TO ofo_app"

      - name: Run database migrations as the owner role
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: alembic -c backend/ofo_app/alembic.ini upgrade head

      - name: OpenAPI document builds
        run: python scripts/generate_openapi.py --out "${RUNNER_TEMP}/openapi.json"

      - name: Run app tests (database tests as ofo_app)
        env:
          OFO_REQUIRE_DB_TESTS: '1'
          TEST_DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: python -m pytest -c pytest-app.ini -q -rs -p no:cacheprovider

  # W-054: frontend skeleton. Core proof: browser -> Vite preview /api proxy -> FastAPI (ofo_app) -> PostgreSQL.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres_ci_dummy_pw
      PGDATABASE: ofo_test
      APP_ROLE_PW: ofo_app_test_pw

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_dummy_pw
          POSTGRES_DB: ofo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-app.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Throwaway broker settings (W-058; as in the api job)
        run: |
          echo "KITE_API_KEY=ci_placeholder_key" >> "$GITHUB_ENV"
          echo "KITE_API_SECRET=ci_placeholder_secret" >> "$GITHUB_ENV"
          echo "KITE_REDIRECT_URL=http://127.0.0.1:8000/kite/callback" >> "$GITHUB_ENV"
          echo "KITE_EXPECTED_USER_ID=ZZ0000" >> "$GITHUB_ENV"
          echo "BROKER_TOKEN_KEY=$(python -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: Create the application role and run migrations (as in the api job)
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${{ env.PGPASSWORD }}@localhost:5432/ofo_test
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ofo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 5 PASSWORD '${APP_ROLE_PW}'" \
            -c "REVOKE CONNECT ON DATABASE ofo_test FROM PUBLIC" \
            -c "GRANT CONNECT ON DATABASE ofo_test TO ofo_app"
          alembic -c backend/ofo_app/alembic.ini upgrade head

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and unit tests
        working-directory: frontend
        run: |
          npm run lint
          npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

      # The browser download took 11 min 18 s in run 36977878623; cache it, keyed on the lockfile (which pins the
      # @playwright/test version), and cap the step.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (cache miss, browser and system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 12
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start the API (uvicorn factory) as ofo_app
        env:
          DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
        run: |
          nohup python -m uvicorn --factory ofo_app.main:create_app --app-dir backend --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/uvicorn.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      # W-064: TEST-ONLY replay mode (APP_ENV=test + OUTCOME_REPLAY=1) serves the recorded 2026-10-08 frames to the
      # outcome route; the screen's core proof reads it through a third preview on port 4175. The API above stays plain.
      - name: Start the API in test-only replay mode (port 8001)
        env:
          DATABASE_URL: postgresql+asyncpg://ofo_app:${{ env.APP_ROLE_PW }}@localhost:5432/ofo_test
          APP_ENV: test
          OUTCOME_REPLAY: '1'
        run: |
          nohup python -m uvicorn --factory ofo_app.main:create_app --app-dir backend --host 127.0.0.1 --port 8001 > "${RUNNER_TEMP}/uvicorn-replay.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/health

      - name: Start the built frontend (preview) with the proxy on the real API, and one on a closed port
        working-directory: frontend
        run: |
          OFO_API_TARGET=http://127.0.0.1:8001 nohup npx vite preview --port 4175 --strictPort > "${RUNNER_TEMP}/preview-replay.log" 2>&1 &
          OFO_API_TARGET=http://127.0.0.1:8000 nohup npx vite preview --port 4173 --strictPort > "${RUNNER_TEMP}/preview.log" 2>&1 &
          OFO_API_TARGET=http://127.0.0.1:9 nohup npx vite preview --port 4174 --strictPort > "${RUNNER_TEMP}/preview-down.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && curl -sf http://127.0.0.1:4174/ > /dev/null && break
            sleep 1
          done
          # the proxy reaches the real database through the real API
          curl -sf http://127.0.0.1:4173/api/health

      - name: Playwright (navigation, health, responsive check of every route; 390 and 1280 px)
        working-directory: frontend
        env:
          PREVIEW_URL: http://127.0.0.1:4173
          PREVIEW_DOWN_URL: http://127.0.0.1:4174
          REPLAY_URL: http://127.0.0.1:4175
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: |
            frontend/screenshots/
            frontend/test-results/
          if-no-files-found: warn

      - name: Server logs on failure
        if: failure()
        run: tail -n 50 "${RUNNER_TEMP}"/uvicorn.log "${RUNNER_TEMP}"/preview.log "${RUNNER_TEMP}"/preview-down.log || true
