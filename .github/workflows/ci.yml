name: CI

on:
  pull_request:
    # A draft pull request is skipped by the job condition below; edited/labeled events never start a run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to a pull request cancels the older run; a run on main is grouped by its commit, so it is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the docs-only test choice diffs the pull request against its base commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest

      - name: Check the generated Claude settings file is current (kit wiring + project addendum)
        if: ${{ !cancelled() }}
        run: python tools/kit_settings.py . --check

      - name: Lint project artifacts
        if: ${{ !cancelled() }}
        run: python tools/factory_lint.py .

      - name: Check requirement trace is not broken
        if: ${{ !cancelled() }}
        run: python tools/trace_check.py .

      - name: Check generated build order is current
        if: ${{ !cancelled() }}
        run: python tools/build_order.py . --check

      - name: Keep the walking skeleton working (smoke commands of skeleton requirements)
        if: ${{ !cancelled() }}
        run: python tools/run_smoke.py .

      - name: Check the requirements-by-section index is current
        if: ${{ !cancelled() }}
        run: python tools/build_spec_index.py . --check

      - name: Check the spec digest is current
        if: ${{ !cancelled() }}
        run: python tools/build_spec_digest.py . --check

      - name: Block restated spec text and missing or stale decision pins (full scan on every PR and push)
        if: ${{ !cancelled() }}
        run: python tools/spec_dupes.py .

      - name: Check findings index is current
        if: ${{ !cancelled() }}
        run: |
          if compgen -G "knowledge/findings/*.json" > /dev/null; then
            python tools/build_findings_index.py . --check
          else
            echo "0 findings: nothing to index"
          fi

      - name: Check every finding's spec_ref resolves
        if: ${{ !cancelled() }}
        run: python tools/check_spec_refs.py .

      - name: Run tests on push (always the full suite)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          if [ -d tests ]; then
            python -m pytest -q -p no:cacheprovider
          else
            echo "no tests/ folder yet — skipping"
          fi

      # Pull request: a docs-only change runs only the tests the project lists in
      # .claude/project/ci-docs-only-tests.txt (opt-in; see the kit GUIDE). No list, an empty list, or
      # any doubt about the diff (tools/change_scope.py answers `code`) runs the full suite as before.
      - name: Run tests on pull request (full suite unless docs-only with a project test list)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if [ ! -d tests ]; then
            echo "no tests/ folder yet — skipping"
            exit 0
          fi
          LIST=.claude/project/ci-docs-only-tests.txt
          TESTS=""
          if [ -f "$LIST" ]; then
            TESTS=$(tr -d '\r' < "$LIST" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' || true)
          fi
          SCOPE=code
          # tools/ci_local.py (a local run, no GITHUB_ACTIONS) always runs the full suite
          if [ -n "$TESTS" ] && [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            SCOPE=$(python tools/change_scope.py --base "${{ github.event.pull_request.base.sha }}" || echo code)
          fi
          if [ "$SCOPE" = "docs-only" ]; then
            echo "docs-only pull request: running only the tests listed in $LIST"
            # shellcheck disable=SC2086
            python -m pytest -q -p no:cacheprovider $TESTS
          else
            python -m pytest -q -p no:cacheprovider
          fi

      - name: Run the kit self-test (wired scripts, folder purity, context budget, guards, release notes)
        if: ${{ !cancelled() }}
        run: python tools/kit_selftest.py .

      - name: Check no kit file was edited, removed, or the lock changed outside an upgrade
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: python tools/kit_drift.py . --ci

      - name: Check no kit file was edited, removed, or the lock changed outside an upgrade (PR)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python tools/kit_drift.py . --ci --base "${{ github.event.pull_request.base.sha }}"

      - name: Check the PR body has a valid Spec-deviation block
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python tools/check_pr_spec_block.py
