name: CI

on:
  pull_request:
    # A draft pull request is skipped by the job condition below; edited/labeled events never start a run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to a pull request cancels the older run; a run on main is grouped by its commit, so it is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the docs-only test choice diffs the pull request against its base commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest

      - name: Check the generated Claude settings file is current (kit wiring + project addendum)
        if: ${{ !cancelled() }}
        run: python tools/kit_settings.py . --check

      - name: Check tracked text files hold no control bytes
        if: ${{ !cancelled() }}
        run: python tools/check_control_bytes.py .

      - name: Lint project artifacts
        if: ${{ !cancelled() }}
        run: python tools/factory_lint.py .

      - name: Check requirement trace is not broken
        if: ${{ !cancelled() }}
        run: python tools/trace_check.py .

      - name: Check generated build order is current
        if: ${{ !cancelled() }}
        run: python tools/build_order.py . --check

      - name: Keep the walking skeleton working (smoke commands of skeleton requirements)
        if: ${{ !cancelled() }}
        run: python tools/run_smoke.py .

      - name: Check the requirements-by-section index is current
        if: ${{ !cancelled() }}
        run: python tools/build_spec_index.py . --check

      - name: Check the spec digest is current
        if: ${{ !cancelled() }}
        run: python tools/build_spec_digest.py . --check

      - name: Block restated spec text and missing or stale decision pins (full scan on every PR and push)
        if: ${{ !cancelled() }}
        run: python tools/spec_dupes.py .

      - name: Check findings index is current
        if: ${{ !cancelled() }}
        run: |
          if compgen -G "knowledge/findings/*.json" > /dev/null; then
            python tools/build_findings_index.py . --check
          else
            echo "0 findings: nothing to index"
          fi

      - name: Check every finding's spec_ref resolves
        if: ${{ !cancelled() }}
        run: python tools/check_spec_refs.py .

      - name: Run tests on push (always the full suite)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          if [ -d tests ]; then
            python -m pytest -q -p no:cacheprovider
          else
            echo "no tests/ folder yet — skipping"
          fi

      # Pull request: a change that is all docs or records (tools/change_scope.py answers `docs-only`) runs the
      # spec checks above and the records test set: the tests carrying the records marker (default `records`;
      # .claude/project/ci-records-marker.txt may name another), plus any tests listed in
      # .claude/project/ci-docs-only-tests.txt (the list adds, it never replaces). No test carrying the marker is
      # not a failure. Any code change, any doubt about the diff, and every push to main run the full suite.
      - name: Run tests on pull request (full suite unless docs-only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if [ ! -d tests ]; then
            echo "no tests/ folder yet — skipping"
            exit 0
          fi
          SCOPE=code
          # a local run (no GITHUB_ACTIONS) runs its own test choice, never this branch
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            SCOPE=$(python tools/change_scope.py --base "${{ github.event.pull_request.base.sha }}" || echo code)
          fi
          if [ "$SCOPE" = "docs-only" ]; then
            MARKER=records
            MFILE=.claude/project/ci-records-marker.txt
            if [ -f "$MFILE" ]; then
              NAMED=$(tr -d '\r' < "$MFILE" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | sed -n '1s/^[[:space:]]*//;1s/[[:space:]]*$//;1p' || true)
              if [ -n "$NAMED" ]; then
                MARKER=$NAMED
              fi
            fi
            echo "docs-only pull request: running the tests marked $MARKER"
            RC=0
            if python -m pytest -q -p no:cacheprovider -m "$MARKER"; then RC=0; else RC=$?; fi
            if [ "$RC" = "5" ]; then
              echo "no test carries the $MARKER marker; records changes are checked by no test"
            elif [ "$RC" = "2" ] || [ "$RC" = "3" ] || [ "$RC" = "4" ]; then
              echo "the $MARKER tests could not be collected (pytest exit $RC): running the full suite"
              python -m pytest -q -p no:cacheprovider
              exit $?
            elif [ "$RC" != "0" ]; then
              exit "$RC"
            fi
            LIST=.claude/project/ci-docs-only-tests.txt
            TESTS=""
            if [ -f "$LIST" ]; then
              TESTS=$(tr -d '\r' < "$LIST" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' || true)
            fi
            if [ -n "$TESTS" ]; then
              echo "docs-only pull request: also running the tests listed in $LIST"
              # shellcheck disable=SC2086
              python -m pytest -q -p no:cacheprovider $TESTS
            fi
          else
            python -m pytest -q -p no:cacheprovider
          fi

      - name: Run the kit self-test (wired scripts, folder purity, context budget, guards, release notes)
        if: ${{ !cancelled() }}
        run: python tools/kit_selftest.py .

      - name: Check no kit file was edited, removed, or the lock changed outside an upgrade
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: python tools/kit_drift.py . --ci

      - name: Check no kit file was edited, removed, or the lock changed outside an upgrade (PR)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python tools/kit_drift.py . --ci --base "${{ github.event.pull_request.base.sha }}"

      - name: Check the PR body has a valid Spec-deviation block
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python tools/check_pr_spec_block.py
