name: coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Coverage register tests
        run: python -m pytest -q -p no:cacheprovider tests/orchestrator/test_coverage.py
      - name: Coverage register check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/orchestrator/coverage.py . --check
