# API/DB tests (W-051). Separate from pytest.ini so the kit CI (tests/, standard library only) is unchanged.
# asyncio settings adapted from abhayla/algochanakya@bf9faf7:backend/pytest.ini (ADR-047); no Allure/coverage addopts.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests_app
pythonpath = backend
python_files = test_*.py
python_functions = test_*
