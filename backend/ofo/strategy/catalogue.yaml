# Adapted from abhayla/algochanakya@2a868db backend/scripts/seed_strategies.py (22 templates,
# spec/technical-design/legacy-reuse.md row 7). Content verified identical at HEAD (bf9faf7) as of
# 2026-09-29 (`git diff` empty between the two revisions of that file).
#
# Translation from the legacy shape to ours:
# - Only `display_name` (-> name) and `description` are carried, reworded (ADR-003); the legacy
#   promotional/educational fields (pros, cons, when_to_use, ...) are not template data (REQ-028 scope).
# - The legacy fixed `strike_offset` points became PARAMETERS (round 3, 2026-09-29): a template is a shape
#   (ADR-006 Q8), so each strike is a linear expression of named step counts measured from the ATM strike,
#   and matching solves those expressions back for the parameters. The legacy offsets (0, +/-100, +/-200
#   points at NIFTY's 50-point gap = 0, +/-2, +/-4 steps) are the DEFAULTS below.
# - Every `min`/`max` bound and every default is an ADR-045 overnight default, NOT an owner decision
#   (work/W-005.md "Parameter defaults"). Signed strike params span -20..20 steps; widths 1..20 steps.
# - The legacy "EQ" leg (own the stock) maps to a FUT leg (ADR-041): no single-stock leg exists here.
# - `wheel_strategy` is dropped: a stock-assignment cycle cannot happen on cash-settled index options.
#   The catalogue is 21 templates.
# - Position words (at-the-money, in-the-money, out-of-the-money, protective) appear in a description
#   only where a constraint makes them true for every allowed parameter value (enforced at load).
templates:
  - id: bull_call_spread
    name: "Bull Call Spread"
    description: Buy a call and sell a call at a higher strike, both the same expiry.
    level: Beginner
    views: [bullish]
    objectives: [directional]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: long_call, action: BUY, instrument: CE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_call, action: SELL, instrument: CE, strike: "k + w", expiry_slot: near, quantity_multiplier: 1}

  - id: bull_put_spread
    name: "Bull Put Spread"
    description: Sell a put and buy a put at a lower strike, both the same expiry.
    level: Beginner
    views: [bullish]
    objectives: [income, directional]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: short_put, action: SELL, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_put, action: BUY, instrument: PE, strike: "k - w", expiry_slot: near, quantity_multiplier: 1}

  - id: synthetic_long
    name: "Synthetic Long"
    description: >-
      Buy a call and sell a put at the same strike and expiry; the combined payoff moves like the
      underlying.
    level: Advanced
    views: [bullish]
    objectives: [directional]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
    constraints: []
    legs:
      - {name: long_call, action: BUY, instrument: CE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_put, action: SELL, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}

  - id: bear_put_spread
    name: "Bear Put Spread"
    description: Buy a put and sell a put at a lower strike, both the same expiry.
    level: Beginner
    views: [bearish]
    objectives: [directional]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: long_put, action: BUY, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_put, action: SELL, instrument: PE, strike: "k - w", expiry_slot: near, quantity_multiplier: 1}

  - id: bear_call_spread
    name: "Bear Call Spread"
    description: Sell a call and buy a call at a higher strike, both the same expiry.
    level: Beginner
    views: [bearish]
    objectives: [income, directional]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: short_call, action: SELL, instrument: CE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_call, action: BUY, instrument: CE, strike: "k + w", expiry_slot: near, quantity_multiplier: 1}

  - id: synthetic_short
    name: "Synthetic Short"
    description: >-
      Buy a put and sell a call at the same strike and expiry; the combined payoff moves opposite the
      underlying.
    level: Advanced
    views: [bearish]
    objectives: [directional]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
    constraints: []
    legs:
      - {name: long_put, action: BUY, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_call, action: SELL, instrument: CE, strike: "k", expiry_slot: near, quantity_multiplier: 1}

  - id: iron_condor
    name: "Iron Condor"
    description: >-
      Sell a put and a call at two different strikes, the put below the call, and buy a put and a call the
      same number of steps further out on each side, all the same expiry: a bull put spread plus a bear
      call spread.
    level: Intermediate
    views: [range-bound]
    objectives: [income]
    params:
      - {name: p, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: q, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: w_put, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
      - {name: w_call, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints:
      - {equal: [w_put, w_call]}
      - {order: [short_put, short_call]}
    legs:
      - {name: long_put, action: BUY, instrument: PE, strike: "-p - w_put", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_put, action: SELL, instrument: PE, strike: "-p", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_call, action: SELL, instrument: CE, strike: "q", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_call, action: BUY, instrument: CE, strike: "q + w_call", expiry_slot: near, quantity_multiplier: 1}

  - id: iron_butterfly
    name: "Iron Fly"
    description: >-
      Sell a call and a put at the at-the-money strike, and buy a put and a call the same number of steps
      away on each side, all the same expiry.
    level: Intermediate
    views: [range-bound]
    objectives: [income]
    params:
      - {name: w_put, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
      - {name: w_call, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints:
      - {equal: [w_put, w_call]}
    legs:
      - {name: long_put, action: BUY, instrument: PE, strike: "-w_put", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_put, action: SELL, instrument: PE, strike: 0, expiry_slot: near, quantity_multiplier: 1}
      - {name: short_call, action: SELL, instrument: CE, strike: 0, expiry_slot: near, quantity_multiplier: 1}
      - {name: long_call, action: BUY, instrument: CE, strike: "w_call", expiry_slot: near, quantity_multiplier: 1}

  - id: short_straddle
    name: "Straddle (Short)"
    description: Sell a call and a put at the at-the-money strike, the same expiry.
    level: Intermediate
    views: [range-bound]
    objectives: [income]
    params: []
    constraints: []
    legs:
      - {name: short_call, action: SELL, instrument: CE, strike: 0, expiry_slot: near, quantity_multiplier: 1}
      - {name: short_put, action: SELL, instrument: PE, strike: 0, expiry_slot: near, quantity_multiplier: 1}

  - id: short_strangle
    name: "Strangle (Short)"
    description: Sell an out-of-the-money call and an out-of-the-money put, both the same expiry.
    level: Intermediate
    views: [range-bound]
    objectives: [income]
    params:
      - {name: c, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: k, unit: steps, default: -2, min: -20, max: 20, must_be_positive: false}
    constraints:
      - {sign: {leg: short_call, is: positive}}
      - {sign: {leg: short_put, is: negative}}
    legs:
      - {name: short_call, action: SELL, instrument: CE, strike: "c", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_put, action: SELL, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}

  - id: jade_lizard
    name: "Jade Lizard"
    description: >-
      Sell an out-of-the-money put, sell an out-of-the-money call and buy a call at a higher strike, all the
      same expiry; there is no upside breakeven when the combined credit exceeds the call spread's width.
    level: Advanced
    views: [range-bound, bullish]
    objectives: [income]
    params:
      - {name: k, unit: steps, default: -2, min: -20, max: 20, must_be_positive: false}
      - {name: c, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints:
      - {sign: {leg: short_put, is: negative}}
      - {sign: {leg: short_call, is: positive}}
    legs:
      - {name: short_put, action: SELL, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_call, action: SELL, instrument: CE, strike: "c", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_call, action: BUY, instrument: CE, strike: "c + w", expiry_slot: near, quantity_multiplier: 1}

  - id: long_straddle
    name: "Straddle (Long)"
    description: Buy a call and a put at the at-the-money strike, the same expiry.
    level: Intermediate
    views: [volatile]
    objectives: [volatility]
    params: []
    constraints: []
    legs:
      - {name: long_call, action: BUY, instrument: CE, strike: 0, expiry_slot: near, quantity_multiplier: 1}
      - {name: long_put, action: BUY, instrument: PE, strike: 0, expiry_slot: near, quantity_multiplier: 1}

  - id: long_strangle
    name: "Strangle (Long)"
    description: Buy an out-of-the-money call and an out-of-the-money put, both the same expiry.
    level: Intermediate
    views: [volatile]
    objectives: [volatility]
    params:
      - {name: c, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: k, unit: steps, default: -2, min: -20, max: 20, must_be_positive: false}
    constraints:
      - {sign: {leg: long_call, is: positive}}
      - {sign: {leg: long_put, is: negative}}
    legs:
      - {name: long_call, action: BUY, instrument: CE, strike: "c", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_put, action: BUY, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}

  - id: reverse_iron_condor
    name: "Reverse Iron Condor"
    description: >-
      Buy a put and a call at two different strikes, the put below the call, and sell a put and a call the
      same number of steps further out on each side, all the same expiry.
    level: Intermediate
    views: [volatile]
    objectives: [volatility]
    params:
      - {name: p, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: q, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: w_put, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
      - {name: w_call, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints:
      - {equal: [w_put, w_call]}
      - {order: [long_put, long_call]}
    legs:
      - {name: short_put, action: SELL, instrument: PE, strike: "-p - w_put", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_put, action: BUY, instrument: PE, strike: "-p", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_call, action: BUY, instrument: CE, strike: "q", expiry_slot: near, quantity_multiplier: 1}
      - {name: short_call, action: SELL, instrument: CE, strike: "q + w_call", expiry_slot: near, quantity_multiplier: 1}

  - id: covered_call
    name: "Covered Call"
    description: >-
      Hold a futures position and sell an out-of-the-money call against it, the same expiry (this platform
      models "own the underlying" as a futures leg, ADR-041; no single-stock leg exists here).
    level: Intermediate
    views: [range-bound, bullish]
    objectives: [income]
    params:
      - {name: c, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
    constraints:
      - {sign: {leg: short_call, is: positive}}
    legs:
      - {name: long_future, action: BUY, instrument: FUT, expiry_slot: near, quantity_multiplier: 1}
      - {name: short_call, action: SELL, instrument: CE, strike: "c", expiry_slot: near, quantity_multiplier: 1}

  - id: cash_secured_put
    name: "Cash-Secured Put"
    description: >-
      Sell an out-of-the-money put, holding cash or margin against the full exposure; cash-settled at expiry
      (no shares are bought or delivered on NIFTY/SENSEX index options).
    level: Intermediate
    views: [bullish, range-bound]
    objectives: [income]
    params:
      - {name: k, unit: steps, default: -2, min: -20, max: 20, must_be_positive: false}
    constraints:
      - {sign: {leg: short_put, is: negative}}
    legs:
      - {name: short_put, action: SELL, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}

  - id: calendar_spread
    name: "Calendar Spread"
    description: Sell a near-expiry call and buy a call at the same strike on a later expiry.
    level: Advanced
    views: [range-bound]
    objectives: [income, volatility]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
    constraints: []
    legs:
      - {name: short_call, action: SELL, instrument: CE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_call, action: BUY, instrument: CE, strike: "k", expiry_slot: next, quantity_multiplier: 1}

  - id: diagonal_spread
    name: "Diagonal Spread"
    description: Buy a call on a later expiry and sell a near-expiry call at a higher strike.
    level: Advanced
    views: [range-bound]
    objectives: [income, volatility]
    params:
      - {name: k, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: short_call, action: SELL, instrument: CE, strike: "k + w", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_call, action: BUY, instrument: CE, strike: "k", expiry_slot: next, quantity_multiplier: 1}

  - id: butterfly_spread
    name: "Butterfly Spread"
    description: >-
      Buy a call, sell two calls a number of strike steps above it, and buy a call the same number of steps
      above those, all the same expiry.
    level: Intermediate
    views: [range-bound]
    objectives: [income]
    params:
      - {name: m, unit: steps, default: 0, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: lower_call, action: BUY, instrument: CE, strike: "m - w", expiry_slot: near, quantity_multiplier: 1}
      - {name: middle_calls, action: SELL, instrument: CE, strike: "m", expiry_slot: near, quantity_multiplier: 2}
      - {name: upper_call, action: BUY, instrument: CE, strike: "m + w", expiry_slot: near, quantity_multiplier: 1}

  - id: ratio_backspread_call
    name: "Call Ratio Backspread"
    description: Sell one call and buy two calls at a higher strike, all the same expiry.
    level: Advanced
    views: [bullish, volatile]
    objectives: [directional, volatility]
    params:
      - {name: k, unit: steps, default: -2, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: short_call, action: SELL, instrument: CE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_calls, action: BUY, instrument: CE, strike: "k + w", expiry_slot: near, quantity_multiplier: 2}

  - id: ratio_backspread_put
    name: "Put Ratio Backspread"
    description: Sell one put and buy two puts at a lower strike, all the same expiry.
    level: Advanced
    views: [bearish, volatile]
    objectives: [directional, volatility]
    params:
      - {name: k, unit: steps, default: 2, min: -20, max: 20, must_be_positive: false}
      - {name: w, unit: steps, default: 2, min: 1, max: 20, must_be_positive: true}
    constraints: []
    legs:
      - {name: short_put, action: SELL, instrument: PE, strike: "k", expiry_slot: near, quantity_multiplier: 1}
      - {name: long_puts, action: BUY, instrument: PE, strike: "k - w", expiry_slot: near, quantity_multiplier: 2}
