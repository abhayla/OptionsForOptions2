# Alembic config for the API/DB layer. Run from the repo root as the OWNER role:
#   ALEMBIC_DATABASE_URL=postgresql+asyncpg://<owner>:<pw>@host:5432/<db> alembic -c backend/ofo_app/alembic.ini upgrade head
# Adapted from abhayla/algochanakya@bf9faf7:backend/alembic.ini (ADR-047). The URL is never stored here.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
